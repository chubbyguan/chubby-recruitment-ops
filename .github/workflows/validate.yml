name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package
        run: python3 plugins/chubby-recruitment-ops/scripts/validate_package.py .
      - name: Run local synthetic checks
        run: python3 plugins/chubby-recruitment-ops/scripts/verify_acceptance.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
